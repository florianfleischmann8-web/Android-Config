              private fun updateStats() {
                  val i = registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  if (i != null) {
                      val l = i.getIntExtra(BatteryManager.EXTRA_LEVEL, 0)
                      val sc = i.getIntExtra(BatteryManager.EXTRA_SCALE, 100).coerceAtLeast(1)
                      val pct = l * 100 / sc
                      val st = i.getIntExtra(BatteryManager.EXTRA_STATUS, -1)
                      val ch = st == BatteryManager.BATTERY_STATUS_CHARGING || st == BatteryManager.BATTERY_STATUS_FULL
                      batteryTv?.text = pct.toString() + "%" + (if (ch) " ⚡" else "")
                      batteryBar?.progress = pct
                  }
                  try {
                      val sf = StatFs(Environment.getDataDirectory().path)
                      val tot = sf.blockCountLong * sf.blockSizeLong
                      val free = sf.availableBytes
                      val used = ((tot - free) * 100 / tot).toInt()
                      storageTv?.text = "$used%"
                      storageSub?.text = (free / 1e9).roundToInt().toString() + " GB frei"
                      storageBar?.progress = used
                  } catch (e: Exception) { }
              }

