name: Build Aura Launcher APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK vorbereiten
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Komplettes Projekt erzeugen
        run: |
          mkdir -p app/src/main/java/com/aura/launcher
          mkdir -p app/src/main/res/values app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AuraLauncher"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.aura.launcher"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.aura.launcher"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  release { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Aura"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:stateNotNeeded="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:pathData="M0,0h108v108h-108z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:startX="0"
                          android:startY="0"
                          android:endX="108"
                          android:endY="108"
                          android:type="linear">
                          <item android:offset="0" android:color="#FF6D28D9" />
                          <item android:offset="0.55" android:color="#FFEC4899" />
                          <item android:offset="1" android:color="#FFF59E0B" />
                      </gradient>
                  </aapt:attr>
              </path>
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#FFFFFFFF" android:pathData="M38,34h10a4,4 0 0 1 4,4v10a4,4 0 0 1 -4,4h-10a4,4 0 0 1 -4,-4v-10a4,4 0 0 1 4,-4z" />
              <path android:fillColor="#D9FFFFFF" android:pathData="M60,34h10a4,4 0 0 1 4,4v10a4,4 0 0 1 -4,4h-10a4,4 0 0 1 -4,-4v-10a4,4 0 0 1 4,-4z" />
              <path android:fillColor="#D9FFFFFF" android:pathData="M38,56h10a4,4 0 0 1 4,4v10a4,4 0 0 1 -4,4h-10a4,4 0 0 1 -4,-4v-10a4,4 0 0 1 4,-4z" />
              <path android:fillColor="#99FFFFFF" android:pathData="M65,56a9,9 0 1 1 0,18a9,9 0 1 1 0,-18z" />
          </vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
              <monochrome android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat > app/src/main/java/com/aura/launcher/MainActivity.kt <<'EOF'
          package com.aura.launcher

          import android.animation.ValueAnimator
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.SharedPreferences
          import android.content.res.ColorStateList
          import android.graphics.*
          import android.graphics.drawable.AdaptiveIconDrawable
          import android.graphics.drawable.ColorDrawable
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraManager
          import android.net.Uri
          import android.os.*
          import android.provider.Settings
          import android.text.InputType
          import android.view.*
          import android.view.animation.DecelerateInterpolator
          import android.view.animation.LinearInterpolator
          import android.widget.*
          import kotlin.math.*
          import kotlin.reflect.KProperty

          const val MATCH = ViewGroup.LayoutParams.MATCH_PARENT
          const val WRAP = ViewGroup.LayoutParams.WRAP_CONTENT
          val W70 = 0xB3FFFFFF.toInt()
          val W50 = 0x80FFFFFF.toInt()

          fun argb(a: Int, rgb: Int): Int = (a shl 24) or (rgb and 0xFFFFFF)
          fun pal(vararg v: Long) = IntArray(v.size) { v[it].toInt() }

          class IntPref(private val sp: SharedPreferences, private val k: String, private val d: Int) {
              operator fun getValue(t: Any?, p: KProperty<*>): Int = sp.getInt(k, d)
              operator fun setValue(t: Any?, p: KProperty<*>, v: Int) { sp.edit().putInt(k, v).apply() }
          }

          class BoolPref(private val sp: SharedPreferences, private val k: String, private val d: Boolean) {
              operator fun getValue(t: Any?, p: KProperty<*>): Boolean = sp.getBoolean(k, d)
              operator fun setValue(t: Any?, p: KProperty<*>, v: Boolean) { sp.edit().putBoolean(k, v).apply() }
          }

          class Cfg(c: Context) {
              val sp: SharedPreferences = c.getSharedPreferences("aura", Context.MODE_PRIVATE)
              var size by IntPref(sp, "size", 60)
              var radius by IntPref(sp, "radius", 34)
              var alpha by IntPref(sp, "alpha", 100)
              var blur by IntPref(sp, "blur", 0)
              var cols by IntPref(sp, "cols", 4)
              var tintColor by IntPref(sp, "tintColor", 0xFFFF4D8D.toInt())
              var tintStrength by IntPref(sp, "tintStrength", 0)
              var accent by IntPref(sp, "accent", 0xFF8B5CF6.toInt())
              var bgBlur by IntPref(sp, "bgBlur", 0)
              var dim by IntPref(sp, "dim", 25)
              var glass by IntPref(sp, "glass", 22)
              var labels by BoolPref(sp, "labels", true)
              var wClock by BoolPref(sp, "wClock", true)
              var wBattery by BoolPref(sp, "wBattery", true)
              var wStorage by BoolPref(sp, "wStorage", true)
              var wNote by BoolPref(sp, "wNote", true)
              var wallpaper: String?
                  get() = sp.getString("wp", null)
                  set(v) { sp.edit().putString("wp", v).apply() }
              var note: String
                  get() = sp.getString("note", "Stay aura ✨") ?: ""
                  set(v) { sp.edit().putString("note", v).apply() }
          }

          class AppItem(val label: String, val pkg: String, val cn: ComponentName, val icon: Drawable)
          class Sug(val emoji: String, val title: String, val desc: String, val action: (() -> Unit)?)
          class Tile(val e: String, val n: String, val f: (View) -> Unit)
          class Scan(
              val apps: Int, val sat: Float, val spread: Int, val luma: Float,
              val score: Int, val sugs: List<Sug>
          )

          class AuroraView(c: Context) : View(c) {
              var accent = 0xFF8B5CF6.toInt()
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private var t = 0f
              private val anim = ValueAnimator.ofFloat(0f, (2 * PI).toFloat()).apply {
                  duration = 26000
                  repeatCount = ValueAnimator.INFINITE
                  interpolator = LinearInterpolator()
                  addUpdateListener { t = it.animatedValue as Float; invalidate() }
              }
              override fun onAttachedToWindow() { super.onAttachedToWindow(); anim.start() }
              override fun onDetachedFromWindow() { anim.cancel(); super.onDetachedFromWindow() }
              override fun onDraw(cv: Canvas) {
                  cv.drawColor(0xFF090912.toInt())
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val hsv = FloatArray(3)
                  Color.colorToHSV(accent, hsv)
                  for (i in 0 until 3) {
                      val col = Color.HSVToColor(floatArrayOf((hsv[0] + i * 58f) % 360f, 0.75f, 1f))
                      val cx = w * (0.5f + 0.40f * cos(t + i * 2.1f))
                      val cy = h * (0.5f + 0.36f * sin(t + i * 1.7f))
                      val r = max(w, h) * 0.7f
                      p.shader = RadialGradient(
                          cx, cy, r, intArrayOf(argb(0x88, col), argb(0, col)),
                          floatArrayOf(0f, 1f), Shader.TileMode.CLAMP
                      )
                      cv.drawRect(0f, 0f, w, h, p)
                  }
              }
          }

          @Suppress("DEPRECATION", "OVERRIDE_DEPRECATION")
          class MainActivity : Activity() {
              private lateinit var cfg: Cfg
              private lateinit var root: FrameLayout
              private lateinit var aurora: AuroraView
              private lateinit var wpView: ImageView
              private lateinit var dimView: View
              private lateinit var content: LinearLayout
              private lateinit var widgetRow: LinearLayout
              private lateinit var grid: GridView
              private lateinit var bar: LinearLayout
              private lateinit var adapter: AppAdapter
              private lateinit var designSheet: Sheet
              private lateinit var scanSheet: Sheet
              private lateinit var quickSheet: Sheet
              private val apps = ArrayList<AppItem>()
              private val cache = HashMap<String, Bitmap>()
              private val handler = Handler(Looper.getMainLooper())
              private var current: Sheet? = null
              private var topInset = 0
              private var botInset = 0
              private var wpBitmap: Bitmap? = null
              private var wpUri: String? = null
              private var lastLoad = 0L
              private var torchOn = false
              private var batteryTv: TextView? = null
              private var batteryBar: ProgressBar? = null
              private var storageTv: TextView? = null
              private var storageSub: TextView? = null
              private var storageBar: ProgressBar? = null

              private val PAL = pal(
                  0xFFFF4D8D, 0xFFFF6B35, 0xFFFFC145, 0xFF2EE6A6, 0xFF22D3EE,
                  0xFF3B82F6, 0xFF8B5CF6, 0xFFE879F9, 0xFFFFFFFF
              )

              private val ticker = object : Runnable {
                  override fun run() { updateStats(); handler.postDelayed(this, 20000) }
              }

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()
              private fun dpf(v: Float): Float = v * resources.displayMetrics.density
              private fun cardR(): Float = dpf(10f + cfg.radius * 0.6f)
              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_SHORT).show()

              // ───────────────────────── Lifecycle ─────────────────────────
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  cfg = Cfg(this)
                  window.statusBarColor = Color.TRANSPARENT
                  window.navigationBarColor = Color.TRANSPARENT
                  window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_LAYOUT_STABLE or
                      View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION

                  root = FrameLayout(this)
                  aurora = AuroraView(this)
                  root.addView(aurora, MATCH, MATCH)
                  wpView = ImageView(this).apply { scaleType = ImageView.ScaleType.CENTER_CROP; visibility = View.GONE }
                  root.addView(wpView, MATCH, MATCH)
                  dimView = View(this)
                  root.addView(dimView, MATCH, MATCH)

                  content = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  root.addView(content, MATCH, MATCH)

                  val ws = HorizontalScrollView(this).apply {
                      isHorizontalScrollBarEnabled = false
                      overScrollMode = View.OVER_SCROLL_NEVER
                      clipToPadding = false
                      setPadding(dp(16), 0, dp(6), dp(6))
                  }
                  widgetRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  ws.addView(widgetRow)
                  content.addView(ws, MATCH, WRAP)

                  adapter = AppAdapter()
                  grid = GridView(this)
                  grid.setSelector(ColorDrawable(Color.TRANSPARENT))
                  grid.overScrollMode = View.OVER_SCROLL_NEVER
                  grid.clipToPadding = false
                  grid.verticalSpacing = dp(6)
                  grid.adapter = adapter
                  grid.setOnItemClickListener { _, _, pos, _ -> launch(apps[pos]) }
                  grid.setOnItemLongClickListener { _, _, pos, _ ->
                      try {
                          startActivity(
                              Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + apps[pos].pkg))
                          )
                      } catch (e: Exception) { }
                      true
                  }
                  content.addView(grid, LinearLayout.LayoutParams(MATCH, 0, 1f))

                  bar = LinearLayout(this).apply {
                      gravity = Gravity.CENTER
                      setPadding(dp(8), dp(8), dp(8), dp(8))
                      background = GradientDrawable().apply {
                          setColor(argb(0xAA, 0x14141E)); cornerRadius = dpf(40f); setStroke(dp(1), argb(0x44, 0xFFFFFF))
                      }
                  }
                  val items = listOf(
                      "🎨  Design" to { openDesign() },
                      "◎  Scan" to { openScan() },
                      "⚡  Quick" to { openQuick() }
                  )
                  for ((label, act) in items) {
                      bar.addView(
                          tv(label, 15f, Color.WHITE, true).apply {
                              setPadding(dp(18), dp(12), dp(18), dp(12))
                              setOnClickListener { act() }
                          },
                          LinearLayout.LayoutParams(WRAP, WRAP)
                      )
                  }
                  root.addView(bar, FrameLayout.LayoutParams(WRAP, WRAP, Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL))

                  designSheet = Sheet("Design Studio")
                  scanSheet = Sheet("Aura Scan")
                  quickSheet = Sheet("Quick Controls")
                  root.addView(designSheet.wrap, MATCH, MATCH)
                  root.addView(scanSheet.wrap, MATCH, MATCH)
                  root.addView(quickSheet.wrap, MATCH, MATCH)

                  setContentView(root)
                  root.setOnApplyWindowInsetsListener { _, ins ->
                      topInset = ins.systemWindowInsetTop
                      botInset = ins.systemWindowInsetBottom
                      applyInsets()
                      ins
                  }
                  applyInsets()
                  applyAll()
                  loadApps()
                  root.requestApplyInsets()
              }

              override fun onResume() {
                  super.onResume()
                  if (SystemClock.elapsedRealtime() - lastLoad > 10000) loadApps()
                  handler.post(ticker)
              }

              override fun onPause() {
                  handler.removeCallbacks(ticker)
                  super.onPause()
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  current?.hide()
                  grid.smoothScrollToPosition(0)
              }

              override fun onBackPressed() { current?.hide() }

              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  if (req == 42 && res == RESULT_OK) {
                      val u = data?.data ?: return
                      try { contentResolver.takePersistableUriPermission(u, Intent.FLAG_GRANT_READ_URI_PERMISSION) } catch (e: Exception) { }
                      cfg.wallpaper = u.toString()
                      applyBackground()
                  }
              }

              private fun applyInsets() {
                  content.setPadding(0, topInset + dp(10), 0, 0)
                  (bar.layoutParams as FrameLayout.LayoutParams).bottomMargin = botInset + dp(18)
                  bar.requestLayout()
                  grid.setPadding(dp(12), dp(8), dp(12), botInset + dp(110))
              }

              private fun applyAll() {
                  applyBackground()
                  refreshIcons()
                  buildWidgets()
              }

              // ───────────────────────── Apps & Icons ─────────────────────────
              private fun loadApps() {
                  lastLoad = SystemClock.elapsedRealtime()
                  Thread {
                      val pm = packageManager
                      val q = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                      val out = ArrayList<AppItem>()
                      for (r in pm.queryIntentActivities(q, 0)) {
                          val ai = r.activityInfo
                          if (ai.packageName == packageName) continue
                          out.add(
                              AppItem(
                                  r.loadLabel(pm).toString(), ai.packageName,
                                  ComponentName(ai.packageName, ai.name), r.loadIcon(pm)
                              )
                          )
                      }
                      out.sortBy { it.label.lowercase() }
                      runOnUiThread {
                          apps.clear(); apps.addAll(out); cache.clear()
                          adapter.notifyDataSetChanged()
                      }
                  }.start()
              }

              private fun launch(a: AppItem) {
                  try {
                      startActivity(
                          Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER).setComponent(a.cn)
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED)
                      )
                  } catch (e: Exception) { toast("App kann nicht geöffnet werden") }
              }

              private fun refreshIcons() {
                  cache.clear()
                  grid.setNumColumns(cfg.cols)
                  adapter.notifyDataSetChanged()
              }

              private fun colorFilter(): ColorFilter? {
                  val s = cfg.tintStrength / 100f
                  if (s <= 0f) return null
                  val c = cfg.tintColor
                  val k = 1.5f
                  val r = Color.red(c) / 255f * k
                  val g = Color.green(c) / 255f * k
                  val b = Color.blue(c) / 255f * k
                  val lr = 0.2126f; val lg = 0.7152f; val lb = 0.0722f
                  val id = floatArrayOf(1f, 0f, 0f, 0f, 0f, 0f, 1f, 0f, 0f, 0f, 0f, 0f, 1f, 0f, 0f, 0f, 0f, 0f, 1f, 0f)
                  val tg = floatArrayOf(
                      lr * r, lg * r, lb * r, 0f, 0f,
                      lr * g, lg * g, lb * g, 0f, 0f,
                      lr * b, lg * b, lb * b, 0f, 0f,
                      0f, 0f, 0f, 1f, 0f
                  )
                  val m = FloatArray(20) { id[it] * (1 - s) + tg[it] * s }
                  return ColorMatrixColorFilter(ColorMatrix(m))
              }

              private fun render(src: Drawable, s: Int): Bitmap {
                  val bmp = Bitmap.createBitmap(s, s, Bitmap.Config.ARGB_8888)
                  val cv = Canvas(bmp)
                  val cf = colorFilter()
                  val d = (src.constantState?.newDrawable() ?: src).mutate()
                  if (d is AdaptiveIconDrawable) {
                      val pad = s / 4
                      for (l in listOf(d.background, d.foreground)) {
                          if (l == null) continue
                          l.setBounds(-pad, -pad, s + pad, s + pad)
                          l.setColorFilter(cf)
                          l.draw(cv)
                      }
                  } else {
                      cv.drawColor(0xFF1C1C28.toInt())
                      val p = (s * 0.14f).toInt()
                      d.setBounds(p, p, s - p, s - p)
                      d.setColorFilter(cf)
                      d.draw(cv)
                  }
                  val rad = s * cfg.radius / 100f
                  val mask = Paint(Paint.ANTI_ALIAS_FLAG)
                  mask.xfermode = PorterDuffXfermode(PorterDuff.Mode.DST_IN)
                  cv.drawRoundRect(RectF(0f, 0f, s.toFloat(), s.toFloat()), rad, rad, mask)
                  return bmp
              }

              inner class AppAdapter : BaseAdapter() {
                  override fun getCount() = apps.size
                  override fun getItem(i: Int): Any = apps[i]
                  override fun getItemId(i: Int) = i.toLong()
                  override fun getView(i: Int, convertView: View?, parent: ViewGroup?): View {
                      val a = apps[i]
                      val cell = (convertView as? LinearLayout) ?: LinearLayout(this@MainActivity).apply {
                          orientation = LinearLayout.VERTICAL
                          gravity = Gravity.CENTER_HORIZONTAL
                          setPadding(0, dp(8), 0, dp(8))
                          addView(ImageView(context))
                          addView(
                              TextView(context).apply {
                                  setTextColor(Color.WHITE); textSize = 11f; maxLines = 1
                                  ellipsize = android.text.TextUtils.TruncateAt.END
                                  gravity = Gravity.CENTER
                                  setShadowLayer(5f, 0f, 1f, 0x99000000.toInt())
                                  setPadding(dp(2), dp(5), dp(2), 0)
                              },
                              LinearLayout.LayoutParams(MATCH, WRAP)
                          )
                      }
                      val s = dp(cfg.size)
                      val iv = cell.getChildAt(0) as ImageView
                      iv.layoutParams = LinearLayout.LayoutParams(s, s)
                      iv.setImageBitmap(cache.getOrPut(a.pkg) { render(a.icon, s) })
                      iv.alpha = cfg.alpha / 100f
                      if (Build.VERSION.SDK_INT >= 31) {
                          iv.setRenderEffect(
                              if (cfg.blur > 0) RenderEffect.createBlurEffect(
                                  cfg.blur.toFloat(), cfg.blur.toFloat(), Shader.TileMode.DECAL
                              ) else null
                          )
                      }
                      val l = cell.getChildAt(1) as TextView
                      l.text = a.label
                      l.visibility = if (cfg.labels) View.VISIBLE else View.GONE
                      cell.setOnTouchListener { v, e ->
                          when (e.actionMasked) {
                              MotionEvent.ACTION_DOWN -> v.animate().scaleX(0.9f).scaleY(0.9f).setDuration(90).start()
                              MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL ->
                                  v.animate().scaleX(1f).scaleY(1f).setDuration(150).start()
                          }
                          false
                      }
                      return cell
                  }
              }

              // ───────────────────────── Hintergrund ─────────────────────────
              private fun decodeWp(u: Uri): Bitmap? {
                  val o = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  contentResolver.openInputStream(u)?.use { BitmapFactory.decodeStream(it, null, o) }
                  var s = 1
                  val m = max(o.outWidth, o.outHeight)
                  while (m / s > 2000) s *= 2
                  val o2 = BitmapFactory.Options().apply { inSampleSize = s }
                  return contentResolver.openInputStream(u)?.use { BitmapFactory.decodeStream(it, null, o2) }
              }

              private fun applyBackground() {
                  aurora.accent = cfg.accent
                  aurora.invalidate()
                  val uri = cfg.wallpaper
                  if (uri == null) {
                      wpBitmap = null; wpUri = null
                  } else if (uri != wpUri) {
                      try { wpBitmap = decodeWp(Uri.parse(uri)); wpUri = uri } catch (e: Exception) { wpBitmap = null }
                  }
                  val ok = wpBitmap != null
                  if (ok) wpView.setImageBitmap(wpBitmap)
                  wpView.visibility = if (ok) View.VISIBLE else View.GONE
                  aurora.visibility = if (ok) View.GONE else View.VISIBLE
                  if (Build.VERSION.SDK_INT >= 31) {
                      wpView.setRenderEffect(
                          if (cfg.bgBlur > 0) RenderEffect.createBlurEffect(
                              cfg.bgBlur.toFloat(), cfg.bgBlur.toFloat(), Shader.TileMode.CLAMP
                          ) else null
                      )
                  }
                  dimView.setBackgroundColor((cfg.dim * 255 / 100) shl 24)
              }

              private fun pickWallpaper() {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                      addCategory(Intent.CATEGORY_OPENABLE)
                      type = "image/*"
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION)
                  }
                  startActivityForResult(i, 42)
              }

