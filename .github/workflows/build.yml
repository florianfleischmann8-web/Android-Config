              private fun slider(name: String, lo: Int, hi: Int, cur: Int, unit: String, onChange: (Int) -> Unit): LinearLayout {
                  val box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(0, dp(6), 0, dp(2)) }
                  val head = LinearLayout(this)
                  val valTv = tv("$cur$unit", 14f, cfg.accent, true)
                  head.addView(tv(name, 14f, Color.WHITE), LinearLayout.LayoutParams(0, WRAP, 1f))
                  head.addView(valTv)
                  val sb = SeekBar(this)
                  sb.max = hi - lo
                  sb.progress = cur - lo
                  sb.progressTintList = ColorStateList.valueOf(cfg.accent)
                  sb.thumbTintList = ColorStateList.valueOf(cfg.accent)
                  sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, user: Boolean) {
                          valTv.text = "${p + lo}$unit"
                          if (user) onChange(p + lo)
                      }
                      override fun onStartTrackingTouch(s: SeekBar?) {}
                      override fun onStopTrackingTouch(s: SeekBar?) {}
                  })
                  box.addView(head, MATCH, WRAP)
                  box.addView(sb, MATCH, WRAP)
                  box.tag = { v: Int -> sb.progress = v - lo }
                  return box
              }

              @Suppress("UNCHECKED_CAST")
              private fun setSlider(box: LinearLayout, v: Int) { (box.tag as (Int) -> Unit)(v) }

              private fun swatches(cur: Int, colors: IntArray, onPick: (Int) -> Unit): View {
                  val hs = HorizontalScrollView(this).apply { isHorizontalScrollBarEnabled = false }
                  val row = LinearLayout(this).apply { setPadding(0, dp(8), 0, dp(8)) }
                  val dots = ArrayList<Pair<View, Int>>()
                  fun paint(sel: Int) {
                      for ((v, c) in dots) {
                          (v.background as GradientDrawable).setStroke(
                              dp(if (c == sel) 3 else 1), if (c == sel) Color.WHITE else 0x55FFFFFF
                          )
                      }
                  }
                  for (c in colors) {
                      val v = View(this)
                      v.background = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(c) }
                      v.setOnClickListener { paint(c); onPick(c) }
                      dots.add(Pair(v, c))
                      row.addView(v, LinearLayout.LayoutParams(dp(38), dp(38)).apply { marginEnd = dp(10) })
                  }
                  paint(cur)
                  hs.addView(row)
                  return hs
              }

              private fun toggle(name: String, cur: Boolean, onChange: (Boolean) -> Unit): View {
                  val row = LinearLayout(this).apply { gravity = Gravity.CENTER_VERTICAL; setPadding(0, dp(6), 0, dp(6)) }
                  row.addView(tv(name, 14f, Color.WHITE), LinearLayout.LayoutParams(0, WRAP, 1f))
                  val sw = Switch(this)
                  sw.isChecked = cur
                  val states = arrayOf(intArrayOf(android.R.attr.state_checked), intArrayOf())
                  sw.thumbTintList = ColorStateList(states, intArrayOf(cfg.accent, 0xFFBBBBBB.toInt()))
                  sw.trackTintList = ColorStateList(states, intArrayOf(argb(0x88, cfg.accent), 0x55FFFFFF))
                  sw.setOnCheckedChangeListener { _, v -> onChange(v) }
                  row.addView(sw)
                  return row
              }

              inner class Sheet(title: String) {
                  val wrap = FrameLayout(this@MainActivity)
                  val body = LinearLayout(this@MainActivity)
                  private val panel = LinearLayout(this@MainActivity)
                  private val scrim = View(this@MainActivity)
                  private val h = (resources.displayMetrics.heightPixels * 0.82f).toInt()

                  init {
                      wrap.visibility = View.GONE
                      scrim.setBackgroundColor(argb(0x99, 0))
                      scrim.setOnClickListener { hide() }
                      wrap.addView(scrim, MATCH, MATCH)
                      panel.orientation = LinearLayout.VERTICAL
                      panel.background = GradientDrawable().apply {
                          setColor(argb(0xF4, 0x12121C))
                          val r = dpf(30f)
                          cornerRadii = floatArrayOf(r, r, r, r, 0f, 0f, 0f, 0f)
                          setStroke(dp(1), argb(0x33, 0xFFFFFF))
                      }
                      val head = LinearLayout(this@MainActivity).apply {
                          gravity = Gravity.CENTER_VERTICAL
                          setPadding(dp(22), dp(18), dp(10), dp(6))
                      }
                      head.addView(tv(title, 22f, Color.WHITE, true), LinearLayout.LayoutParams(0, WRAP, 1f))
                      head.addView(tv("✕", 20f, W70).apply {
                          setPadding(dp(14), dp(8), dp(14), dp(8))
                          setOnClickListener { hide() }
                      })
                      panel.addView(head, MATCH, WRAP)
                      body.orientation = LinearLayout.VERTICAL
                      body.setPadding(dp(22), dp(4), dp(22), dp(90))
                      val sv = ScrollView(this@MainActivity).apply {
                          isVerticalScrollBarEnabled = false
                          overScrollMode = View.OVER_SCROLL_NEVER
                      }
                      sv.addView(body, MATCH, WRAP)
                      panel.addView(sv, LinearLayout.LayoutParams(MATCH, 0, 1f))
                      wrap.addView(panel, FrameLayout.LayoutParams(MATCH, h, Gravity.BOTTOM))
                  }

                  fun show() {
                      current?.hide(false)
                      current = this
                      wrap.visibility = View.VISIBLE
                      scrim.alpha = 0f
                      scrim.animate().alpha(1f).setDuration(220).start()
                      panel.translationY = h.toFloat()
                      panel.animate().translationY(0f).setDuration(300).setInterpolator(DecelerateInterpolator()).start()
                  }

                  fun hide(animate: Boolean = true) {
                      if (current === this) current = null
                      if (!animate) { wrap.visibility = View.GONE; return }
                      scrim.animate().alpha(0f).setDuration(180).start()
                      panel.animate().translationY(h.toFloat()).setDuration(220).withEndAction {
                          if (current !== this) wrap.visibility = View.GONE
                      }.start()
                  }
              }

