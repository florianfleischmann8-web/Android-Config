              private fun runScan() {
                  val b = scanSheet.body
                  b.removeAllViews()
                  val st = tv("Starte…", 15f, Color.WHITE, true).apply { setPadding(0, dp(20), 0, dp(10)) }
                  val pb = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply {
                      max = 100; progressTintList = ColorStateList.valueOf(cfg.accent)
                  }
                  b.addView(st)
                  b.addView(pb, MATCH, dp(8))
                  Thread {
                      try {
                          val res = analyze { p, m -> runOnUiThread { pb.progress = p; st.text = m } }
                          runOnUiThread { showScan(res) }
                      } catch (e: Exception) {
                          runOnUiThread { toast("Scan fehlgeschlagen"); buildScan() }
                      }
                  }.start()
              }

              private fun analyze(report: (Int, String) -> Unit): Scan {
                  val list = ArrayList(apps)
                  report(8, "Apps werden gezählt…"); Thread.sleep(350)
                  val hist = FloatArray(12)
                  var satSum = 0f
                  var cnt = 0
                  report(30, "Icon-Farben werden analysiert…")
                  val px = IntArray(16 * 16)
                  for (a in list) {
                      val bm = Bitmap.createBitmap(16, 16, Bitmap.Config.ARGB_8888)
                      val d = (a.icon.constantState?.newDrawable() ?: a.icon).mutate()
                      d.setBounds(0, 0, 16, 16)
                      d.draw(Canvas(bm))
                      bm.getPixels(px, 0, 16, 0, 0, 16, 16)
                      var r = 0L; var g = 0L; var bl = 0L; var n = 0
                      for (p in px) {
                          if (Color.alpha(p) > 200) { r += Color.red(p); g += Color.green(p); bl += Color.blue(p); n++ }
                      }
                      if (n == 0) continue
                      val hsv = FloatArray(3)
                      Color.RGBToHSV((r / n).toInt(), (g / n).toInt(), (bl / n).toInt(), hsv)
                      satSum += hsv[1]; cnt++
                      if (hsv[1] > 0.3f && hsv[2] > 0.25f) hist[(hsv[0] / 30f).toInt().coerceIn(0, 11)] += 1f
                  }
                  val sat = if (cnt > 0) satSum / cnt else 0f
                  val spread = hist.count { it > cnt * 0.07f }
                  var best = 0
                  for (i in 1 until 12) if (hist[i] > hist[best]) best = i
                  val domColor = if (hist[best] > 0f) Color.HSVToColor(floatArrayOf(best * 30f + 15f, 0.75f, 1f)) else cfg.accent
                  val names = listOf("Rot", "Orange", "Gelb", "Limette", "Grün", "Mint", "Cyan", "Himmelblau", "Blau", "Violett", "Magenta", "Pink")
                  val domName = names[best]

                  report(55, "Wallpaper wird vermessen…"); Thread.sleep(350)
                  var luma = 0.12f
                  var busy = 0.12f
                  val wb = wpBitmap
                  if (wb != null) {
                      val sm = Bitmap.createScaledBitmap(wb, 24, 24, true)
                      val ps = IntArray(24 * 24)
                      sm.getPixels(ps, 0, 24, 0, 0, 24, 24)
                      val ls = ps.map { (0.2126f * Color.red(it) + 0.7152f * Color.green(it) + 0.0722f * Color.blue(it)) / 255f }
                      luma = ls.average().toFloat()
                      val mean = luma
                      busy = sqrt(ls.map { (it - mean) * (it - mean) }.average()).toFloat()
                  }

                  report(78, "Widgets & Layout werden geprüft…"); Thread.sleep(350)
                  val n = list.size
                  val anyWidget = cfg.wClock || cfg.wBattery || cfg.wStorage || cfg.wNote
                  val harmony = if (cfg.tintStrength >= 60) 1f else (1f - (spread - 1).coerceAtLeast(0) / 6f).coerceIn(0f, 1f)
                  var score = (40 * harmony).toInt()
                  score += if (cfg.radius in 22..42) 15 else 6
                  score += if (cfg.size in 48..72) 15 else 6
                  score += if (anyWidget) 10 else 0
                  score += if (busy < 0.2f || cfg.dim >= 20 || cfg.bgBlur >= 6) 10 else 4
                  score += if ((n > 40 && cfg.cols >= 5) || n <= 40) 10 else 4

                  val sugs = ArrayList<Sug>()
                  fun add(e: String, t: String, d: String, a: () -> Unit) { sugs.add(Sug(e, t, d, a)) }

                  if (spread >= 5 && sat > 0.3f && cfg.tintStrength < 50) {
                      add("🎨", "Farbchaos beruhigen", "Deine Icons mischen $spread Farbwelten. Ein einheitlicher $domName-Look wirkt deutlich hochwertiger.") {
                          cfg.tintColor = domColor; cfg.tintStrength = 75; cfg.accent = domColor
                      }
                  } else if (sat < 0.22f && cfg.tintStrength < 20) {
                      add("✨", "Mehr Farbe ins Spiel", "Deine Icons wirken blass. Ein sanfter Akzent-Ton bringt Tiefe, ohne zu überladen.") {
                          cfg.tintColor = cfg.accent; cfg.tintStrength = 40
                      }
                  }
                  if (n > 45 && (cfg.size > 58 || cfg.cols < 5)) {
                      add("📐", "Dichteres Raster", "Bei $n Apps passen 5 Spalten mit kleineren Icons besser – weniger Scrollen, ruhigeres Bild.") {
                          cfg.size = 54; cfg.cols = 5
                      }
                  } else if (n in 1..24 && cfg.size < 68) {
                      add("🔎", "Größere Icons", "Du hast nur $n Apps – große Icons nutzen den Platz besser und sehen edler aus.") {
                          cfg.size = 74; cfg.cols = 4
                      }
                  }
                  if (cfg.radius !in 26..42) {
                      add("🟦", "Squircle-Form", "Eine Rundung um 36 % ist der moderne Mittelweg zwischen Quadrat und Kreis.") { cfg.radius = 36 }
                  }
                  if (luma > 0.6f && cfg.dim < 25) {
                      add("🌗", "Wallpaper abdunkeln", "Dein Hintergrund ist sehr hell – Labels und Widgets sind schwer lesbar. Etwas Abdunklung hilft.") { cfg.dim = 35 }
                  }
                  if (wb != null && busy > 0.22f && cfg.bgBlur < 6) {
                      add("🌫", "Unruhiges Wallpaper beruhigen", "Viele Details hinter den Icons stören. Leichter Blur (ab Android 12) schafft Fokus.") {
                          cfg.bgBlur = 8; cfg.dim = max(cfg.dim, 25)
                      }
                  }
                  if (luma < 0.35f && cfg.glass < 18) {
                      add("🧊", "Frosted-Glass-Widgets", "Auf dunklem Hintergrund wirken Widgets mit mehr Glas-Anteil deutlich edler.") { cfg.glass = 26 }
                  }
                  if (!anyWidget) {
                      add("🧩", "Couture-Widgets aktivieren", "Uhr und Akku-Karte geben dem Homescreen Struktur und Funktion.") {
                          cfg.wClock = true; cfg.wBattery = true
                      }
                  }
                  if (sugs.isEmpty()) {
                      sugs.add(Sug("🔥", "Dein Setup sitzt", "Farben, Größen und Hintergrund passen zusammen. Probier trotzdem mal ein Preset im Design Studio.", null))
                  }
                  report(100, "Vorschläge werden berechnet…"); Thread.sleep(300)
                  return Scan(n, sat, spread, luma, score.coerceIn(0, 100), sugs)
              }

              private fun showScan(s: Scan) {
                  val b = scanSheet.body
                  b.removeAllViews()
                  val top = LinearLayout(this).apply { gravity = Gravity.CENTER_VERTICAL; setPadding(0, dp(8), 0, dp(8)) }
                  val big = tv("0", 64f, Color.WHITE, true)
                  top.addView(big)
                  top.addView(tv("/100\nDesign-Score", 14f, W70).apply { setPadding(dp(10), 0, 0, 0) })
                  ValueAnimator.ofInt(0, s.score).apply {
                      duration = 900
                      addUpdateListener { big.text = (it.animatedValue as Int).toString() }
                  }.start()
                  b.addView(top)
                  val tone = if (s.luma > 0.5f) "hell" else "dunkel"
                  b.addView(tv("📱 ${s.apps} Apps  ·  🎨 ${(s.sat * 100).roundToInt()}% Sättigung  ·  🌈 ${s.spread} Farbwelten  ·  🖼 Wallpaper $tone", 12f, W70))
                  b.addView(section("VORSCHLÄGE"))
                  for (g in s.sugs) {
                      val c = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          setPadding(dp(16), dp(14), dp(16), dp(14))
                          background = glass(dpf(20f), 10)
                      }
                      c.addView(tv(g.emoji + "  " + g.title, 16f, Color.WHITE, true))
                      c.addView(tv(g.desc, 13f, W70).apply { setPadding(0, dp(4), 0, dp(10)) })
                      val act = g.action
                      if (act != null) {
                          val btn = pill("Anwenden", true) { }
                          btn.setOnClickListener {
                              act(); applyAll()
                              btn.text = "✓  Angewendet"; btn.alpha = 0.6f
                          }
                          c.addView(btn, MATCH, WRAP)
                      }
                      b.addView(c, LinearLayout.LayoutParams(MATCH, WRAP).apply { topMargin = dp(10) })
                  }
                  b.addView(
                      pill("⚡  Alle anwenden", true) {
                          for (g in s.sugs) g.action?.invoke()
                          applyAll(); toast("Alles angewendet ✨"); buildScan()
                      },
                      LinearLayout.LayoutParams(MATCH, WRAP).apply { topMargin = dp(20) }
                  )
                  b.addView(
                      pill("Neu scannen") { runScan() },
                      LinearLayout.LayoutParams(MATCH, WRAP).apply { topMargin = dp(10) }
                  )
              }

              // ───────────────────────── Quick Controls ─────────────────────────
              private fun openQuick() { buildQuick(); quickSheet.show() }

              private fun tileBg(active: Boolean) = GradientDrawable().apply {
                  cornerRadius = cardR()
                  if (active) setColor(cfg.accent) else setColor(argb(0x1F, 0xFFFFFF))
                  setStroke(dp(1), argb(0x33, 0xFFFFFF))
              }

              private fun go(action: String) {
                  try {
                      startActivity(Intent(action).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                  } catch (e: Exception) {
                      try { startActivity(Intent(Settings.ACTION_SETTINGS)) } catch (e2: Exception) { }
                  }
              }

              private fun toggleTorch(v: View) {
                  try {
                      val cm = getSystemService(Context.CAMERA_SERVICE) as CameraManager
                      val id = cm.cameraIdList.firstOrNull {
                          cm.getCameraCharacteristics(it).get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true
                      }
                      if (id == null) { toast("Kein Blitz gefunden"); return }
                      torchOn = !torchOn
                      cm.setTorchMode(id, torchOn)
                      v.background = tileBg(torchOn)
                  } catch (e: Exception) { toast("Taschenlampe nicht verfügbar") }
              }

              private fun buildQuick() {
                  val b = quickSheet.body
                  b.removeAllViews()
                  b.addView(tv("Die Kacheln folgen deiner Icon-Rundung und Akzentfarbe.", 12f, W50).apply { setPadding(0, 0, 0, dp(8)) })
                  val tiles = listOf(
                      Tile("📶", "WLAN") { go(Settings.Panel.ACTION_INTERNET_CONNECTIVITY) },
                      Tile("🔵", "Bluetooth") { go(Settings.ACTION_BLUETOOTH_SETTINGS) },
                      Tile("🔊", "Lautstärke") { go(Settings.Panel.ACTION_VOLUME) },
                      Tile("☀️", "Helligkeit") { go(Settings.ACTION_DISPLAY_SETTINGS) },
                      Tile("🔦", "Taschenlampe") { toggleTorch(it) },
                      Tile("✈️", "Flugmodus") { go(Settings.ACTION_AIRPLANE_MODE_SETTINGS) },
                      Tile("🔋", "Akku") { go(Intent.ACTION_POWER_USAGE_SUMMARY) },
                      Tile("🏠", "Standard-Launcher") { go(Settings.ACTION_HOME_SETTINGS) },
                      Tile("🎨", "Design Studio") { openDesign() },
                      Tile("◎", "Aura Scan") { openScan() }
                  )
                  for (row in tiles.chunked(2)) {
                      val r = LinearLayout(this)
                      for (t in row) {
                          val v = LinearLayout(this).apply {
                              orientation = LinearLayout.VERTICAL
                              gravity = Gravity.CENTER_VERTICAL
                              setPadding(dp(16), dp(14), dp(16), dp(14))
                              background = tileBg(t.n == "Taschenlampe" && torchOn)
                          }
                          v.addView(tv(t.e, 26f, Color.WHITE))
                          v.addView(tv(t.n, 14f, Color.WHITE, true).apply { setPadding(0, dp(6), 0, 0) })
                          v.setOnClickListener { t.f(v) }
                          r.addView(v, LinearLayout.LayoutParams(0, dp(92), 1f).apply { setMargins(dp(5), dp(5), dp(5), dp(5)) })
                      }
                      b.addView(r, MATCH, WRAP)
                  }
              }
          }
          EOF

      - name: APK bauen
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: AuraLauncher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
